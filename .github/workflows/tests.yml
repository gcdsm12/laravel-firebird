name: Tests
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
          - laravel: '^13.0'
            testbench: '^11.0'
            phpunit: '^12.0'
    services:
      firebird:
        image: jacobalberty/firebird:v2.5.9-sc
        env:
          FIREBIRD_DATABASE: database.fdb
          ISC_PASSWORD: masterkey
          EnableLegacyClientAuth: 'true'
        ports: ['3050:3050']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_firebird
          tools: composer:v2
          coverage: none
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-update
      - run: composer update --prefer-dist --no-interaction
      - name: Wait for disposable Firebird
        run: |
          for attempt in {1..30}; do
            if nc -z 127.0.0.1 3050; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: composer test:integration
        env:
          FIREBIRD_TEST_DISPOSABLE: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3050'
          DB_DATABASE: /firebird/data/database.fdb
          DB_USERNAME: SYSDBA
          DB_PASSWORD: masterkey
          DB_CHARSET: UTF8
